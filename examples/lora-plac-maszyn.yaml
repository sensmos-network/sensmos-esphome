# Plac maszyn i zbiornik paliwa na gospodarstwie albo budowie: poziom oleju napędowego, „ktoś rusza maszynę w nocy”
# i spadek paliwa (kradzież) przez LoRa Sensmos, na baterii z panelem, bez Wi-Fi na placu.
# Płytka śpi (deep sleep), budzi się co 30 min albo od wstrząsu, mierzy, wysyła jedną ramkę i znów zasypia.
#
# ZBIORNIK: ultradźwiękowy JSN-SR04T w pokrywie zbiornika (TRIG GPIO6, ECHO GPIO7 przez dzielnik 5 V → 3,3 V), zasilanie
#   czujnika 5 V. TYLKO olej napędowy, olej opałowy albo AdBlue: nad benzyną są wybuchowe opary, tam żadnej elektroniki.
#   Kalibracja jak w lora-szambo.yaml: odległość do dna i do lustra przy pełnym, pojemność, kształt.
# RUCH: czujnik drgań SW-420 na GPIO5 (zasilanie 3,3 V), przykręcony do maszyny albo do bramy placu. Wstrząs budzi płytkę.
# ZASILANIE: ogniwo 18650 w gnieździe akumulatora Heltec V3 i mały panel słoneczny 5 V.
#
# W Home Assistant (sub 15): sensor.sensmos_lora_15_lvl (%), …_l (litry), …_mv (1 = obudził go wstrząs), …_v (ogniwo).
# Alarm ruchu w nocy i spadku paliwa (integracja statistics HA): README, sekcja „Recipes”.
substitutions:
  sub: "15"
  empty_cm: "150"
  full_cm: "20"
  liters: "2500"
  shape: "0"           # 0 = prostopadłościan albo pionowy walec, 1 = leżący walec
  every: 30min

esphome:
  name: plac-maszyn-lora
  on_boot:
    priority: -100
    then:
      - delay: 500ms
      - repeat:                                # 5 pomiarów do mediany
          count: 5
          then:
            - component.update: dist
            - delay: 300ms
      - component.update: level
      - component.update: litres
      - component.update: vbat
      - component.update: moved
      - sensmos_lora.send:
      - delay: 1s
      - sx126x.set_mode_sleep: lora
      - deep_sleep.enter: sleepy

esp32:
  board: heltec_wifi_lora_32_V3
  framework:
    type: esp-idf

logger:

deep_sleep:
  id: sleepy
  sleep_duration: ${every}
  wakeup_pin: GPIO5
  wakeup_pin_mode: INVERT_WAKEUP               # maszyna jeszcze drga przy zasypianiu: czekamy na zmianę stanu

external_components:
  - source: github://sensmos-network/sensmos-esphome@main
    components: [sensmos_lora]

spi:
  clk_pin: GPIO9
  mosi_pin: GPIO10
  miso_pin: GPIO11

# Kanał domowy Sensmos (Europa). Tych wartości nie zmieniaj, inaczej nody nie usłyszą płytki.
sx126x:
  id: lora
  cs_pin: GPIO8
  rst_pin: GPIO12
  busy_pin: GPIO13
  dio1_pin: GPIO14
  hw_version: sx1262
  rf_switch: true
  tcxo_voltage: 1_8V
  modulation: LORA
  frequency: 868.1MHz
  bandwidth: 125_0kHz
  spreading_factor: 11
  coding_rate: CR_4_5
  sync_value: [0x34, 0x44]
  preamble_size: 8
  crc_enable: true
  pa_power: 14

sensor:
  - platform: ultrasonic
    id: dist
    trigger_pin: GPIO6
    echo_pin: GPIO7
    timeout: 4m
    update_interval: never
    unit_of_measurement: cm
    filters:
      - multiply: 100              # m → cm
      - median:
          window_size: 5
          send_every: 5
  - platform: template
    id: level
    unit_of_measurement: "%"
    update_interval: never
    lambda: |-
      if (std::isnan(id(dist).state)) return NAN;
      const float e = ${empty_cm}, f = ${full_cm};
      float h = (e - id(dist).state) / (e - f);
      if (h < 0) h = 0;
      if (h > 1) h = 1;
      return h * 100.0f;
  - platform: template
    id: litres
    unit_of_measurement: L
    update_interval: never
    lambda: |-
      if (std::isnan(id(level).state)) return NAN;
      const float h = id(level).state / 100.0f;
      if (${shape} == 0) return h * ${liters};
      const float a = 2.0f * acosf(1.0f - 2.0f * h);
      return (a - sinf(a)) / (2.0f * (float) M_PI) * ${liters};
  - platform: adc
    id: vbat
    pin: GPIO1
    attenuation: 12db
    samples: 8
    update_interval: never
    filters:
      - multiply: 4.9
  - platform: template
    id: moved
    update_interval: never
    lambda: |-
      return esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_EXT0 ? 1.0f : 0.0f;

sensmos_lora:
  hub: "a1b2c3d4"                  # id8 twojego Huba albo noda
  sub: ${sub}
  key: "zmien-mnie-na-swoja-fraze"  # w praktyce: !secret sensmos_lora_key
  update_interval: 24h             # ramki wysyła on_boot; to tylko zapas
  sensors:
    - sensor: level
      key: lvl
      decimals: 0
    - sensor: litres
      key: l
      decimals: 0
    - sensor: moved
      key: mv
      decimals: 0
    - sensor: vbat
      key: v
      decimals: 2
